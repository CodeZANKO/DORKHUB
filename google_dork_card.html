<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.5rem; display: flex; justify-content: center;">
<div style="width: 100%; max-width: 420px; background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; padding: 3px 8px; border-radius: var(--border-radius-md); background: var(--color-background-info); color: var(--color-text-info); font-weight: 500;">exposed cameras</span>
      <span style="font-size: 12px; padding: 3px 8px; border-radius: var(--border-radius-md); background: var(--color-background-danger); color: var(--color-text-danger); font-weight: 500;">high risk</span>
    </div>
    <span style="font-size: 12px; color: var(--color-text-tertiary);">GHDB #7236</span>
  </div>

  <div style="padding: 16px;">
    <div style="font-family: var(--font-mono); font-size: 13px; line-height: 1.6; background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; word-break: break-all;">
      <span style="color: var(--color-text-info); font-weight: 500;">intitle:</span><span style="color: var(--color-text-primary);">"webcamXP"</span>
      <span style="color: var(--color-text-info); font-weight: 500;"> inurl:</span><span style="color: var(--color-text-primary);">8080</span>
      <span style="color: var(--color-text-info); font-weight: 500;"> -intext:</span><span style="color: var(--color-text-primary);">"login"</span>
    </div>

    <p style="font-size: 14px; color: var(--color-text-secondary); margin: 12px 0 0; line-height: 1.5;">
      Finds publicly indexed webcamXP interfaces left without a login prompt, often exposing a live feed to anyone with the link.
    </p>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--color-border-tertiary);">
      <span style="font-size: 12px; color: var(--color-text-tertiary);">added 2024-03-11 &middot; google</span>
      <div style="display: flex; gap: 6px;">
        <button onclick="navigator.clipboard.writeText('intitle:&quot;webcamXP&quot; inurl:8080 -intext:&quot;login&quot;')" style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 10px;">
          <i class="ti ti-copy" style="font-size: 15px;" aria-hidden="true"></i>copy
        </button>
        <button onclick="sendPrompt('Explain why this dork works and how to fix the exposure')" style="display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 10px;">
          <i class="ti ti-arrow-right" style="font-size: 15px;" aria-hidden="true"></i>explain ↗
        </button>
      </div>
    </div>
  </div>
</div>
</div>
